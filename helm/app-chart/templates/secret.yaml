# ============================================================
# Secret — sensitive credentials.
#
# The DB password is base64-encoded by Helm's b64enc filter.
# In production, replace this with External Secrets Operator
# pulling from AWS Secrets Manager to avoid storing secrets
# in Helm values at all.
#
# This Secret is only rendered if db.password is non-empty.
# If empty, the Deployment falls back to an existing Secret
# (e.g. the one created by the Bitnami postgresql chart).
# ============================================================
{{- if .Values.db.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eks-app.fullname" . }}-secret
  labels:
    {{- include "eks-app.labels" . | nindent 4 }}
type: Opaque
data:
  # base64-encoded by Helm — never store plaintext here
  PGPASSWORD: {{ .Values.db.password | b64enc | quote }}
{{- end }}
