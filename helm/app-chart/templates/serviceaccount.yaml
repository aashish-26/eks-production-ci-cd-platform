# ============================================================
# ServiceAccount — Kubernetes identity for the app pod.
#
# Having a dedicated SA (instead of using "default") allows:
#   - IRSA: annotate the SA with an IAM role ARN so pods can
#     call AWS APIs (S3, Secrets Manager, etc.) without node creds.
#   - RBAC: grant fine-grained Kubernetes permissions to the app.
#   - Audit logs: pod actions are attributed to this SA name.
#
# Set serviceAccount.create: false and serviceAccount.name: <name>
# to bring your own SA instead of creating one.
# ============================================================
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eks-app.fullname" . }}
  labels:
    {{- include "eks-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
