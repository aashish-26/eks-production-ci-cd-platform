# ============================================================
# HorizontalPodAutoscaler
#
# Scales replica count based on average CPU utilisation.
# When CPU across all pods exceeds the target, HPA adds replicas
# (up to maxReplicas). When load drops, it scales back down
# (eventually to minReplicas).
#
# Requires the metrics-server add-on to be installed on EKS.
# The kube-prometheus-stack (monitoring module) includes this.
# ============================================================
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "eks-app.fullname" . }}-hpa
  labels:
    {{- include "eks-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "eks-app.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
