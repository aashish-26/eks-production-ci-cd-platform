# Service — stable internal DNS name and port for the Deployment.
# Type NodePort: exposes a port on every node so the ALB (target-type: instance)
# can route traffic to pods via kube-proxy.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eks-app.fullname" . }}
  labels:
    {{- include "eks-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port:       {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol:   TCP
      name:       http
  selector:
    {{- include "eks-app.labels" . | nindent 4 }}
