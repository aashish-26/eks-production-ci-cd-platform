replicaCount: 2

image:
  repository: eks-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
  - host: eks-app.example.com
    paths:
    - path: /
      pathType: ImplementationSpecific

namespace: default

# HPA configuration
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

# PodDisruptionBudget
pdb:
  enabled: true
  minAvailable: 1

# Database connection (filled after deploying PostgreSQL)
db:
  host: postgresql.database.svc.cluster.local
  port: 5432
  user: postgres
  database: ordersdb
  # Secret that contains the DB password (helm/bitnami creates this)
  passwordSecret: postgresql
  passwordKey: postgresql-password
