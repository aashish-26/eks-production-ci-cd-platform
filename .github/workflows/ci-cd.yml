name: CI/CD Build, Push & Deploy

on:
  push:
    branches: [ main ]

env:
  AWS_REGION:    ap-south-1
  ECR_REPO_NAME: eks-app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            -f app/Dockerfile \
            app/
          docker push $ECR_REPOSITORY:$IMAGE_TAG

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Copy PostgreSQL secret to default namespace
        run: |
          kubectl get secret postgresql -n database -o json \
            | jq 'del(
                .metadata.resourceVersion,
                .metadata.uid,
                .metadata.creationTimestamp,
                .metadata.annotations,
                .metadata.ownerReferences
              ) | .metadata.namespace = "default"' \
            | kubectl apply -f -

      - name: Deploy via Helm
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          helm upgrade --install eks-app helm/app-chart \
            --namespace default --create-namespace \
            --set image.repository=$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

      - name: Smoke test
        run: |
          ALB_HOST=$(kubectl get ingress \
            -n default \
            -l "app.kubernetes.io/instance=eks-app" \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
          echo "ALB hostname: $ALB_HOST"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_HOST/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "Smoke test FAILED"
          exit 1
