version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       ordersdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT:       8080
      LOG_LEVEL:  debug
      PGHOST:     db
      PGPORT:     5432
      PGUSER:     postgres
      PGPASSWORD: postgres
      PGDATABASE: ordersdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
